name: Build StokKasir APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -o StokKasirV3-GitHub.zip -d project
          echo "=== Isi folder project ==="
          ls -la project

      - name: Configure AndroidX
        run: |
          find project -name "gradle.properties" -type f | while read f; do
            echo "" >> "$f"
            echo "android.useAndroidX=true" >> "$f"
            echo "android.enableJetifier=true" >> "$f"
            echo "Sudah diupdate: $f"
          done
          
          # Kalau nggak ada gradle.properties sama sekali, bikin baru di root project
          if ! find project -name "gradle.properties" -type f | grep -q .; then
            echo "android.useAndroidX=true" > project/gradle.properties
            echo "android.enableJetifier=true" >> project/gradle.properties
            echo "Dibuat baru: project/gradle.properties"
          fi

      - name: Build APK
        working-directory: project
        run: |
          echo "=== Isi folder project ==="
          ls -la
          echo ""
          echo "=== Mulai build ==="
          
          gradle assembleDebug \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StokKasir-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
