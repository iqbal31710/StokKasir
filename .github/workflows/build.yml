name: Build StokKasir APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -o StokKasirV3-GitHub.zip -d project
          echo "=== Isi folder project ==="
          ls -la project

      - name: Configure gradle.properties
        run: |
          cat >> project/gradle.properties << 'EOF'

          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          kotlin.jvm.target.validation.mode=warning
          EOF

          echo "=== Isi gradle.properties ==="
          cat project/gradle.properties

      - name: Tambahkan JVM Target 17 ke build.gradle
        run: |
          # Patch app/build.gradle.kts (kalau ada)
          if [ -f project/app/build.gradle.kts ]; then
            cat >> project/app/build.gradle.kts << 'EOF'

          // === Patch dari CI: paksa JVM target 17 ===
          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          tasks.withType<JavaCompile>().configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }
          EOF
            echo "✅ app/build.gradle.kts dipatch"
          fi

          # Patch app/build.gradle (groovy) kalau yang ada versi .gradle
          if [ -f project/app/build.gradle ]; then
            cat >> project/app/build.gradle << 'EOF'

          // === Patch dari CI: paksa JVM target 17 ===
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          tasks.withType(JavaCompile).configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }
          EOF
            echo "✅ app/build.gradle dipatch"
          fi

          # Patch root build.gradle.kts juga (kalau ada)
          if [ -f project/build.gradle.kts ]; then
            cat >> project/build.gradle.kts << 'EOF'

          // === Patch dari CI: paksa JVM target 17 untuk semua subproject ===
          subprojects {
              tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                  kotlinOptions {
                      jvmTarget = "17"
                  }
              }
              tasks.withType<JavaCompile>().configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }
          }
          EOF
            echo "✅ root build.gradle.kts dipatch"
          fi

      - name: Build APK
        working-directory: project
        run: |
          echo "=== Mulai build ==="
          gradle assembleDebug \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true \
            -Pkotlin.jvm.target.validation.mode=warning \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StokKasir-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
