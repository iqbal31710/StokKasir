name: Build StokKasir APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Extract project ZIP
        run: |
          mkdir -p project
          unzip -o StokKasirV3-GitHub.zip -d project
          echo "=== Isi folder project ==="
          ls -la project

      - name: Configure AndroidX & JVM 17
        run: |
          # Cari semua file gradle.properties di dalam project
          find project -name "gradle.properties" -type f | while read f; do
            echo "" >> "$f"
            echo "android.useAndroidX=true" >> "$f"
            echo "android.enableJetifier=true" >> "$f"
            echo "Sudah diupdate: $f"
          done

      - name: Build APK
        working-directory: project
        run: |
          chmod +x gradlew || true
          ./gradlew assembleDebug \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true \
            --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StokKasir-APK
          path: |
            project/app/build/outputs/apk/debug/*.apk
            project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error          if [ -f project/android/gradle.properties ]; then
            echo "android.useAndroidX=true" >> project/android/gradle.properties
            echo "android.enableJetifier=true" >> project/android/gradle.properties
          elif [ -f project/gradle.properties ]; then
            echo "android.useAndroidX=true" >> project/gradle.properties
            echo "android.enableJetifier=true" >> project/gradle.properties
          else
            echo "gradle.properties tidak ditemukan, skip."
          fi

      - name: Build APK
        working-directory: project
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StokKasir-APK
          path: |
            project/app/build/outputs/apk/debug/*.apk
            project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error         EOF
         
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StokKasir-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
